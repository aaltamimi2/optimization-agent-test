[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optim-agent"
version = "0.1.0"
description = "Multi-agent LP/MILP optimization solver from natural language"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.3.10",
    "langchain",
    "langchain-google-genai",
    "pydantic>=2.0",
    "pulp>=2.7",
    "python-dotenv",
    "rich",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
optim-agent = "optim_agent.agent:main"
